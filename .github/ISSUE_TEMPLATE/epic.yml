name: Epic
description: An engineering epic that delivers against a roadmap opportunity or goal
title: ""
type: Epic
projects: ["OHF-Device-Database/1"]
body:
  - type: markdown
    attributes:
      value: |
        An epic is the engineering slice of a roadmap item. The user problem, community signals, product-level solution and appetite live in the roadmap opportunity; this epic holds what the team will build, how, and when it is done.

  - type: textarea
    id: parent
    attributes:
      label: Parent
      description: >-
        The roadmap item this epic delivers against, highest level that applies.
        An opportunity (OpenHomeFoundation/roadmap#NNN) plus one sentence naming which slice of it this epic covers;
        one opportunity can fan out to several epics, say which one this is.
        No opportunity? Link the goal or sub-goal instead, plus one line on why the work exists
        (maintenance, spec bump, blocker tracking). That is normal; do not invent an opportunity to fill the field.
        Set the same link as the GitHub parent issue so the hierarchy shows on the board.
      placeholder: "OpenHomeFoundation/roadmap#87, Lane A: contribution mechanism on the starter fields"
    validations:
      required: true

  - type: textarea
    id: technical-context
    attributes:
      label: Technical context
      description: >-
        What in the stack this touches: spec versions, libraries, upstream SDKs, certification.
        3 to 6 lines. Do not restate the user problem.
    validations:
      required: true

  - type: textarea
    id: approach
    attributes:
      label: Approach
      description: >-
        Engineering decisions and constraints only. Product-level solution stays in the opportunity.
        If you diverge from the opportunity's foreseen solution, say so here and add a row to the opportunity's decision log.
    validations:
      required: true

  - type: textarea
    id: deliverables
    attributes:
      label: Deliverables
      description: >-
        Checklist of what ships in THIS epic: releases, PRs, docs, tests. Link each once it exists.
        Work that belongs to another epic goes in a follow-up link under Risks & dependencies, not here.
      value: |
        - [ ] 
        - [ ] 
        - [ ] 
    validations:
      required: true

  - type: textarea
    id: completion-criteria
    attributes:
      label: Completion criteria
      description: >-
        Observable and testable: device behaviour, test state, closed issues. Not "X works".
        An outcome the team cannot force (ranking, adoption) gets a baseline and a time box, otherwise the epic never closes.
      value: |
        - [ ] 
        - [ ] 
    validations:
      required: true

  - type: textarea
    id: risks-dependencies
    attributes:
      label: Risks & dependencies
      description: >-
        Specific to this epic: upstream timing, firmware maturity, decisions owned elsewhere, follow-up epics this spawns.
        Product-level risks stay in the opportunity.
